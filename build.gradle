plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '1.0.21'
    id 'me.champeau.jmh'     version '0.7.3'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    maven { name = 'LuckPerms';  url = 'https://repo.lucko.me/' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'java.net.preferIPv4Stack', 'true'
        }
        client { client() }
        server { server() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

dependencies {
    // LuckPerms is a soft dependency — present at compile, not required at runtime.
    compileOnly "net.luckperms:api:${luckperms_api_version}"

    // TesseraUI is a soft dependency (client-side GUI, optional) — CurseMaven coordinates are
    // opaque file ids, not human-readable versions: tesseraui-1540971 = project id, 8116441 =
    // file id for TesseraUI ${tesseraui_version}.
    compileOnly "curse.maven:tesseraui-1540971:8116441"

    // GameTest source set depends on main output
    gameTestImplementation sourceSets.main.output

    // JMH benchmarks depend on main compiled classes only (no transitive NeoForge deps).
    // files() évite le conflit Gson entre testImplementation:2.11.0 et NeoForge:strictly 2.10.1.
    // Les benchmarks n'utilisent que des classes pur-Java (PermissionResolver, GradesConfig).
    jmhImplementation files(sourceSets.main.output.classesDirs)

    // JUnit 5 — tests unitaires purs Java (sans NeoForge)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // SLF4J pour tests unitaires (ConfigManager utilise LoggerFactory hors NeoForge)
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // Gson pour tests unitaires (transitive de NeoForge, pas exposée au classpath test)
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

test {
    useJUnitPlatform()
}

// jmhJar regroupe le runtime NeoForge (>65535 entries) — zip64 obligatoire.
tasks.named('jmhJar', Jar) { zip64 = true }

// Résout le conflit Gson entre testImplementation:2.11.0 et NeoForge strictly:2.10.1
// uniquement sur le classpath JMH (n'affecte pas les tests JUnit5).
configurations.named('jmhRuntimeClasspath') {
    resolutionStrategy.force 'com.google.code.gson:gson:2.10.1'
}

// JMH microbenchmarks — hot paths (story 6-3 — NFR1, NFR4, AR1, AR11)
// Ne PAS ajouter sourceSet sourceSets.jmh dans neoForge.mods : les benchmarks
// tournent dans un JVM autonome sans NeoForge.
jmh {
    jmhVersion       = '1.37'
    warmupIterations = 3
    iterations       = 5
    fork             = 3
    // benchmarkMode omis — chaque classe déclare son propre @BenchmarkMode (P1 review fix)
    // project.buildDir déprécié depuis Gradle 7.1 → project.layout.buildDirectory (P2 review fix)
    resultsFile      = project.layout.buildDirectory.file("results/jmh/results.json").get().asFile
    resultFormat     = 'JSON'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
