plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '1.0.21'
    id 'me.champeau.jmh'     version '0.7.3'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { name = 'LuckPerms';  url = 'https://repo.lucko.me/' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        // Serves CurseForge files only: never let it answer for another group.
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    luckPermsGameTestMod {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'java.net.preferIPv4Stack', 'true'
        }
        client { client() }
        server { server() }
        // Two explicit GameTest modes, each in its own game directory so the result never depends on
        // whatever sits in run/mods. The system property lets GameTestModeTest fail if a mode drifts.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'customperm.gametest.luckperms', 'false'
        }
        gameTestServerLuckPerms {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest-luckperms')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'customperm.gametest.luckperms', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

dependencies {
    // LuckPerms is a soft dependency — present at compile, not required at runtime.
    compileOnly "net.luckperms:api:${luckperms_api_version}"

    // Arcadia Lib 1.3.0 for 1.21.1 (CurseForge file 8713651), cluster mode's MySQL connection. Optional at runtime:
    // only cluster/ArcadiaLibBridge touches it, and only once the mod is loaded. Same jar as the GitHub release
    // asset v1.3.0 (sha256 575fc6a4191849116ce3e1e846c8440b4a97112a84adbc3d66228a454e3fde5b).
    compileOnly("curse.maven:arcadia-lib-1493170:8713651") { transitive = false }

    // MariaDB Connector/J 3.5.10, for the dev runs only. CustomPerm ships no database driver: cluster/JdbcDrivers
    // instantiates by name whatever driver another mod already loaded, so nothing third-party travels in the jar and the
    // licence stays the kit's All Rights Reserved with no carve-out. This line puts a driver on the run classpath so a
    // dev server exercises the direct path; it is not compiled against and not distributed. Checked: the Maven Central
    // jar (sha256 919b8c1c...abcb18b2) carries a valid signature from the MariaDB Enterprise Signing Key, fingerprint
    // 4C47 0FFF EFC4 D3DC 5977 8655 CE1A 3DD5 E3C9 4F49.
    additionalRuntimeClasspath("org.mariadb.jdbc:mariadb-java-client:3.5.10") { transitive = false }

    // GameTest source set depends on main output
    gameTestImplementation sourceSets.main.output

    // LuckPerms NeoForge 5.4.150 (CurseForge file 5971552), the minimum CustomPerm accepts. Only copied
    // into the LuckPerms GameTest mode's mods folder, never on a compile or runtime classpath.
    luckPermsGameTestMod "curse.maven:luckperms-431733:5971552"

    // JMH benchmarks depend on main compiled classes only (no transitive NeoForge deps).
    // files() avoids the Gson conflict between testImplementation:2.11.0 and NeoForge strictly:2.10.1.
    // The benchmarks only touch pure Java classes (PermissionResolver, GradesConfig).
    jmhImplementation files(sourceSets.main.output.classesDirs)

    // JUnit 5: pure Java unit tests, with no NeoForge.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    // H2 in MySQL mode runs cluster mode's SQL in CI without a MySQL server. Tests only, never in the jar.
    // 2.4.240: same sha256 on Maven Central and the h2database GitHub release (29b70e42...57ce0).
    testImplementation 'com.h2database:h2:2.4.240'
    // Test-only, never distributed: gives JdbcDriversTest a real driver to resolve by name.
    testImplementation('org.mariadb.jdbc:mariadb-java-client:3.5.10') { transitive = false }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // SLF4J for the unit tests: ConfigManager uses LoggerFactory outside NeoForge.
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // Gson for the unit tests: transitive through NeoForge, not exposed to the test classpath.
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

test {
    useJUnitPlatform()
}

// GameTest mods folders are rebuilt before every run: empty for the internal mode, LuckPerms only for
// the LuckPerms mode.
def prepareInternalGameTestMods = tasks.register('prepareInternalGameTestMods', Delete) {
    delete 'run/gametest/mods'
}
def prepareLuckPermsGameTestMods = tasks.register('prepareLuckPermsGameTestMods', Sync) {
    from configurations.luckPermsGameTestMod
    into 'run/gametest-luckperms/mods'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareInternalGameTestMods }
tasks.matching { it.name == 'runGameTestServerLuckPerms' }.configureEach { dependsOn prepareLuckPermsGameTestMods }

// jmhJar bundles the NeoForge runtime (over 65535 entries), so zip64 is required.
tasks.named('jmhJar', Jar) { zip64 = true }

// Resolves the Gson conflict between testImplementation:2.11.0 and NeoForge strictly:2.10.1
// on the JMH classpath only; the JUnit 5 tests are untouched.
configurations.named('jmhRuntimeClasspath') {
    resolutionStrategy.force 'com.google.code.gson:gson:2.10.1'
}

// JMH microbenchmarks — hot paths (story 6-3 — NFR1, NFR4, AR1, AR11)
// Do NOT add sourceSets.jmh to neoForge.mods: the benchmarks run in a standalone JVM
// without NeoForge.
jmh {
    jmhVersion       = '1.37'
    warmupIterations = 3
    iterations       = 5
    fork             = 3
    // benchmarkMode omis — chaque classe déclare son propre @BenchmarkMode (P1 review fix)
    // project.buildDir déprécié depuis Gradle 7.1 → project.layout.buildDirectory (P2 review fix)
    resultsFile      = project.layout.buildDirectory.file("results/jmh/results.json").get().asFile
    resultFormat     = 'JSON'
}

// A distributed build must carry the terms it is distributed under: the jar
// previously shipped with no license text at all.
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE'))   { into 'META-INF' }
    from(rootProject.file('NOTICE.md')) { into 'META-INF' }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
