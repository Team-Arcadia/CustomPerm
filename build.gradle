plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '1.0.21'
    id 'me.champeau.jmh'     version '0.7.3'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { name = 'LuckPerms';  url = 'https://repo.lucko.me/' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        // Serves CurseForge files only: never let it answer for another group.
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    luckPermsGameTestMod {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    arcadiaLibGameTestMod {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'java.net.preferIPv4Stack', 'true'
        }
        client { client() }
        server { server() }
        // Two explicit GameTest modes, each in its own game directory so the result never depends on
        // whatever sits in run/mods. The system property lets GameTestModeTest fail if a mode drifts.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'customperm.gametest.luckperms', 'false'
        }
        gameTestServerLuckPerms {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest-luckperms')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'customperm.gametest.luckperms', 'true'
        }
        // Third mode: Arcadia Lib and nothing else, so the driver CustomPerm finds is the one another mod
        // brought in a nested jar. That is the production configuration, and the only way to exercise it.
        gameTestServerArcadia {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest-arcadia')
            // The whole suite plus the driver tests. The simulated connection declares Arcadia Lib's own
            // channels (see TestPlayer), which is what its join handler writes to without asking, so this mode
            // runs everything with both mods loaded and catches any interference between them.
            systemProperty 'neoforge.enabledGameTestNamespaces', 'customperm,customperm_driver'
            systemProperty 'customperm.gametest.luckperms', 'false'
            systemProperty 'customperm.gametest.arcadia', 'true'
        }
        // Spark scenarios S01 to S03 of the test procedure, played by SparkScenario in a fresh world. spark goes
        // in run/spark/mods by hand, never in the build; reports stay on disk, the verdict is spark-report.txt.
        sparkScenario {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/spark')
            programArguments.addAll '--username', 'SparkAdmin'
            systemProperty 'customperm.spark', 'true'
            // -PsparkScenarios=s03 plays one scenario; all three by default.
            systemProperty 'customperm.spark.scenarios', (project.findProperty('sparkScenarios') ?: 's01,s02,s03').toString()
        }
        // The real-client steps of the test procedure a singleplayer world reaches (V02 to V05, V08, V10, V11),
        // played by gametest/client/ClientSmoke. Verdict in run/clientsmoke/smoke-report.txt.
        clientSmoke {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/clientsmoke')
            programArguments.addAll '--username', 'SmokeAdmin', '--width', '1280', '--height', '720'
            systemProperty 'customperm.clientSmoke', 'true'
        }
        // For the hand checks of the test procedure: the world runClientSmoke seeded (grades, players, an alias, a
        // limit and its levels), without LuckPerms and without any driver. The next runClientSmoke starts it afresh.
        manualClient {
            client()
            gameDirectory = project.file('run/clientsmoke')
            programArguments.addAll '--username', 'SmokeAdmin', '--quickPlaySingleplayer', 'customperm-smoke'
        }
        // tools/server_smoke.py: a dedicated server running LuckPerms, joined by a client without CustomPerm (V01)
        // and by an admin client that plays the LuckPerms pages and the import selection (V09).
        smokeServer {
            server()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/serversmoke/server')
            programArgument '--nogui'
        }
        smokeAdmin {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/serversmoke/admin')
            programArguments.addAll '--username', 'SmokeAdmin', '--quickPlayMultiplayer', '127.0.0.1:25630', '--width', '1280', '--height', '720'
            systemProperty 'customperm.serverSmoke', 'admin'
        }
        // No mod from this project at all: the client a player without CustomPerm connects with.
        smokeBare {
            client()
            gameDirectory = project.file('run/serversmoke/bare')
            programArguments.addAll '--username', 'BareClient', '--quickPlayMultiplayer', '127.0.0.1:25630'
            mods.set([])
        }
        // tools/cluster_smoke.py: two members joined directly on MariaDB (the driver is the dev runs' own), with smoke
        // players driven over RCON (gametest/cluster/SmokePlayers), and an admin client on the first one (V06, V07).
        ['a', 'b'].each { member ->
            "clusterSmoke${member.toUpperCase()}" {
                server()
                sourceSet = sourceSets.gameTest
                gameDirectory = project.file("run/clustersmoke/dev-${member}")
                programArgument '--nogui'
                systemProperty 'customperm.clusterSmoke', 'true'
            }
        }
        clusterSmokeAdmin {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/clustersmoke/admin')
            programArguments.addAll '--username', 'ClusterAdmin', '--quickPlayMultiplayer', '127.0.0.1:25640', '--width', '1280', '--height', '720'
            systemProperty 'customperm.clusterSmoke.client', 'true'
        }
        // Spark scenario S04: two cluster members through Arcadia Lib, driven by tools/spark_cluster.py over RCON.
        sparkClusterA {
            server()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/spark-cluster/a')
            programArgument '--nogui'
            systemProperty 'customperm.sparkCluster', 'true'
        }
        sparkClusterB {
            server()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run/spark-cluster/b')
            programArgument '--nogui'
            systemProperty 'customperm.sparkCluster', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

dependencies {
    // LuckPerms is a soft dependency — present at compile, not required at runtime.
    compileOnly "net.luckperms:api:${luckperms_api_version}"

    // Arcadia Lib 1.3.0 for 1.21.1 (CurseForge file 8713651), cluster mode's MySQL connection. Optional at runtime:
    // only cluster/ArcadiaLibBridge touches it, and only once the mod is loaded. Same jar as the GitHub release
    // asset v1.3.0 (sha256 575fc6a4191849116ce3e1e846c8440b4a97112a84adbc3d66228a454e3fde5b).
    compileOnly("curse.maven:arcadia-lib-1493170:8713651") { transitive = false }

    // MariaDB Connector/J 3.5.10, for the dev runs only. CustomPerm ships no database driver: cluster/JdbcDrivers
    // instantiates by name whatever driver another mod already loaded, so nothing third-party travels in the jar and the
    // licence stays the kit's All Rights Reserved with no carve-out. This line puts a driver on the run classpath so a
    // dev server exercises the direct path; it is not compiled against and not distributed. Checked: the Maven Central
    // jar (sha256 919b8c1c...abcb18b2) carries a valid signature from the MariaDB Enterprise Signing Key, fingerprint
    // 4C47 0FFF EFC4 D3DC 5977 8655 CE1A 3DD5 E3C9 4F49.
    additionalRuntimeClasspath("org.mariadb.jdbc:mariadb-java-client:3.5.10") { transitive = false }

    // GameTest source set depends on main output
    gameTestImplementation sourceSets.main.output

    // LuckPerms NeoForge 5.4.150 (CurseForge file 5971552), the minimum CustomPerm accepts. Only copied
    // into the LuckPerms GameTest mode's mods folder, never on a compile or runtime classpath.
    luckPermsGameTestMod "curse.maven:luckperms-431733:5971552"

    // Arcadia Lib 1.3.0 (CurseForge file 8713651), copied into the Arcadia GameTest mode's mods folder only.
    // It is the mod that brings a JDBC driver on a real server, so it is how the cross-mod driver lookup of
    // cluster/JdbcDrivers gets exercised for real rather than against the run classpath.
    arcadiaLibGameTestMod "curse.maven:arcadia-lib-1493170:8713651"

    // JMH benchmarks depend on main compiled classes only (no transitive NeoForge deps).
    // files() avoids the Gson conflict between testImplementation:2.11.0 and NeoForge strictly:2.10.1.
    // The benchmarks only touch pure Java classes (PermissionResolver, GradesConfig).
    jmhImplementation files(sourceSets.main.output.classesDirs)

    // JUnit 5: pure Java unit tests, with no NeoForge.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    // H2 in MySQL mode runs cluster mode's SQL in CI without a MySQL server. Tests only, never in the jar.
    // 2.4.240: same sha256 on Maven Central and the h2database GitHub release (29b70e42...57ce0).
    testImplementation 'com.h2database:h2:2.4.240'
    // Test-only, never distributed: gives JdbcDriversTest a real driver to resolve by name.
    testImplementation('org.mariadb.jdbc:mariadb-java-client:3.5.10') { transitive = false }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // SLF4J for the unit tests: ConfigManager uses LoggerFactory outside NeoForge.
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'

    // Gson for the unit tests: transitive through NeoForge, not exposed to the test classpath.
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

test {
    useJUnitPlatform()
}

// GameTest mods folders are rebuilt before every run: empty for the internal mode, LuckPerms only for
// the LuckPerms mode.
def prepareInternalGameTestMods = tasks.register('prepareInternalGameTestMods', Delete) {
    delete 'run/gametest/mods'
}
def prepareLuckPermsGameTestMods = tasks.register('prepareLuckPermsGameTestMods', Sync) {
    from configurations.luckPermsGameTestMod
    into 'run/gametest-luckperms/mods'
}
def prepareArcadiaGameTestMods = tasks.register('prepareArcadiaGameTestMods', Sync) {
    from configurations.arcadiaLibGameTestMod
    into 'run/gametest-arcadia/mods'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareInternalGameTestMods }
tasks.matching { it.name == 'runGameTestServerLuckPerms' }.configureEach { dependsOn prepareLuckPermsGameTestMods }
tasks.matching { it.name == 'runGameTestServerArcadia' }.configureEach { dependsOn prepareArcadiaGameTestMods }

// A run exits 0 when the game never started or ran no test at all (the '--tests' trap of 2026-09-21), so each
// GameTest mode is judged on the log it wrote: the summary line must be there and nothing fatal around it.
def fatalLogPatterns = ['failed to load correctly', 'ModLoadingException', 'Failed to start the minecraft server',
                        'invalid dist', 'Mixin apply failed', 'InvalidInjectionException', 'UnrecognizedOptionException']
def failOnLog = { File log, List<String> patterns ->
    if (!log.exists()) throw new GradleException("${log} was not written: the game never started.")
    def hits = log.readLines('UTF-8').findAll { line -> patterns.any { line.contains(it) } }
    if (hits) throw new GradleException("${log.name} shows a fatal line:\n  " + hits.take(5).join('\n  '))
}
[
    ['runGameTestServer', 'run/gametest'],
    ['runGameTestServerLuckPerms', 'run/gametest-luckperms'],
    ['runGameTestServerArcadia', 'run/gametest-arcadia'],
].each { runName, dir ->
    def verify = tasks.register("verify${runName.capitalize()}") {
        group = 'verification'
        description = "Judges ${runName} from its log, never from its exit code."
        outputs.upToDateWhen { false }
        doLast {
            def log = file("${dir}/logs/latest.log")
            failOnLog(log, fatalLogPatterns)
            def passed = log.readLines('UTF-8').findResult { (it =~ /All (\d+) required tests passed/).with { m -> m.find() ? m.group(1) as int : null } }
            if (passed == null || passed == 0) {
                throw new GradleException("${runName}: no 'All N required tests passed' line in ${log}, or N is 0.")
            }
            file("${dir}/gametest-count.txt").text = "${passed}\n"
            logger.lifecycle("${runName}: ${passed} required tests passed.")
        }
    }
    tasks.matching { it.name == runName }.configureEach {
        doFirst { delete "${dir}/logs/latest.log", "${dir}/gametest-count.txt" }
        finalizedBy verify
        mustRunAfter 'build'
    }
}

// Every spark run starts from nothing: no world, no CustomPerm config, no remembered player names. spark's own
// folder and options.txt are kept.
def prepareSparkScenario = tasks.register('prepareSparkScenario', Delete) {
    delete 'run/spark/saves', 'run/spark/config/arcadia/customperm', 'run/spark/config/customperm', 'run/spark/usernamecache.json',
            'run/spark/usercache.json', 'run/spark/spark-report.txt'
    doLast {
        def spark = file('run/spark/mods').listFiles()?.find { it.name.startsWith('spark-') && it.name.endsWith('.jar') }
        if (spark == null) {
            throw new GradleException('Put the spark mod jar (NeoForge 1.21.1) in run/spark/mods first; it is never part of the build.')
        }
    }
}
tasks.matching { it.name == 'runSparkScenario' }.configureEach { dependsOn prepareSparkScenario }

// Options that keep a driven client from stopping on its own: no onboarding, no pause menu when the window loses
// focus, no sound, a fixed language and GUI scale.
def automationOptions = { File dir, Map extra = [:] ->
    def options = [onboardAccessibility: 'false', pauseOnLostFocus: 'false', tutorialStep: 'none', joinedFirstServer: 'true',
                   skipMultiplayerWarning: 'true', soundCategory_master: '0.0', lang: 'en_us', guiScale: '2',
                   narrator: '0', fullscreen: 'false'] + extra
    dir.mkdirs()
    new File(dir, 'options.txt').text = options.collect { k, v -> "${k}:${v}" }.join('\n') + '\n'
}

def verifyClientSmoke = tasks.register('verifyClientSmoke') {
    group = 'verification'
    description = 'Judges runClientSmoke from its report and its log.'
    outputs.upToDateWhen { false }
    doLast {
        failOnLog(file('run/clientsmoke/logs/latest.log'), fatalLogPatterns)
        def report = file('run/clientsmoke/smoke-report.txt')
        if (!report.exists()) throw new GradleException('run/clientsmoke/smoke-report.txt was not written: the run stopped early.')
        def lines = report.readLines('UTF-8')
        def failed = lines.findAll { it.startsWith('FAIL ') }
        if (!lines || !lines.last().startsWith('RESULT PASS')) {
            throw new GradleException("Client smoke: ${lines ? lines.last() : 'empty report'}\n  " + failed.join('\n  '))
        }
        logger.lifecycle("Client smoke: ${lines.last()}. Screenshots in run/clientsmoke/screenshots.")
    }
}
def prepareSmokeServer = tasks.register('prepareSmokeServer', Sync) {
    from configurations.luckPermsGameTestMod
    into 'run/serversmoke/server/mods'
}
tasks.matching { it.name == 'runSmokeServer' }.configureEach { dependsOn prepareSmokeServer }
['smokeAdmin', 'smokeBare'].each { client ->
    tasks.matching { it.name == "run${client.capitalize()}" }.configureEach {
        doFirst {
            def dir = file("run/serversmoke/${client == 'smokeAdmin' ? 'admin' : 'bare'}")
            delete "${dir}/screenshots", "${dir}/smoke-report.txt", "${dir}/logs/latest.log"
            automationOptions(dir)
        }
    }
}

tasks.matching { it.name == 'runClusterSmokeAdmin' }.configureEach {
    doFirst {
        delete 'run/clustersmoke/admin/screenshots', 'run/clustersmoke/admin/smoke-report.txt', 'run/clustersmoke/admin/logs/latest.log'
        automationOptions(file('run/clustersmoke/admin'))
    }
}

tasks.matching { it.name == 'runClientSmoke' }.configureEach {
    doFirst {
        delete 'run/clientsmoke/saves', 'run/clientsmoke/config/arcadia/customperm', 'run/clientsmoke/screenshots',
                'run/clientsmoke/smoke-report.txt', 'run/clientsmoke/logs/latest.log', 'run/clientsmoke/usercache.json',
                'run/clientsmoke/usernamecache.json'
        automationOptions(file('run/clientsmoke'))
    }
    finalizedBy verifyClientSmoke
}

// S04 members carry Arcadia Lib, whose connector reaches the database; spark is copied in by the script.
['a', 'b'].each { member ->
    def prepare = tasks.register("prepareSparkCluster${member.toUpperCase()}", Sync) {
        from configurations.arcadiaLibGameTestMod
        into "run/spark-cluster/${member}/mods"
        preserve { include 'spark-*.jar' }
    }
    tasks.matching { it.name == "runSparkCluster${member.toUpperCase()}" }.configureEach { dependsOn prepare }
}

// jmhJar bundles the NeoForge runtime (over 65535 entries), so zip64 is required.
tasks.named('jmhJar', Jar) { zip64 = true }

// Resolves the Gson conflict between testImplementation:2.11.0 and NeoForge strictly:2.10.1
// on the JMH classpath only; the JUnit 5 tests are untouched.
configurations.named('jmhRuntimeClasspath') {
    resolutionStrategy.force 'com.google.code.gson:gson:2.10.1'
}

// JMH microbenchmarks — hot paths (story 6-3 — NFR1, NFR4, AR1, AR11)
// Do NOT add sourceSets.jmh to neoForge.mods: the benchmarks run in a standalone JVM
// without NeoForge.
jmh {
    jmhVersion       = '1.37'
    warmupIterations = 3
    iterations       = 5
    fork             = 3
    // benchmarkMode omis — chaque classe déclare son propre @BenchmarkMode (P1 review fix)
    // project.buildDir déprécié depuis Gradle 7.1 → project.layout.buildDirectory (P2 review fix)
    resultsFile      = project.layout.buildDirectory.file("results/jmh/results.json").get().asFile
    resultFormat     = 'JSON'
}

// A distributed build must carry the terms it is distributed under: the jar
// previously shipped with no license text at all.
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE'))   { into 'META-INF' }
    from(rootProject.file('NOTICE.md')) { into 'META-INF' }
    // LICENSE §5.3(a) promises credit in the CONTRIBUTORS.md "distributed with" the mod.
    from(rootProject.file('CONTRIBUTORS.md')) { into 'META-INF' }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// The licence carries no third-party clause, and that only holds while the jar carries no
// third-party file. Bundling one again means reopening the clause and the corresponding-source duty
// that comes with it, so the invariant breaks the build rather than waiting for a reviewer's eye.
tasks.register('verifyPackage') {
    description = 'Fails when the jar carries a third-party file or its licence metadata drifts.'
    group = 'verification'
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(jarFile)
    // The harness classes share the main packages' prefix, so they are listed from their own output.
    def gameTestClassDirs = sourceSets.gameTest.output.classesDirs
    dependsOn 'gameTestClasses'
    outputs.upToDateWhen { false }
    doLast {
        def gameTestClasses = [] as Set
        gameTestClassDirs.each { dir ->
            if (dir.exists()) dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.class')) gameTestClasses << dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            }
        }
        def allowedFiles = [
            'META-INF/MANIFEST.MF', 'META-INF/neoforge.mods.toml',
            'META-INF/LICENSE', 'META-INF/NOTICE.md', 'META-INF/CONTRIBUTORS.md', 'pack.mcmeta'
        ] as Set
        def allowedPrefixes = ['com/arcadia/customperm/', 'data/customperm/', 'assets/customperm/']
        def problems = []
        def licenseText = null
        def modsToml = null

        new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name
                if (name == 'META-INF/LICENSE') licenseText = zip.getInputStream(entry).text
                if (name == 'META-INF/neoforge.mods.toml') modsToml = zip.getInputStream(entry).text
                if (entry.directory) return
                if (gameTestClasses.contains(name) || name.contains('/gametest/') || name.endsWith('.nbt')) {
                    problems << "test harness file shipped: ${name}"
                    return
                }
                if (name.startsWith('META-INF/jarjar/')) {
                    problems << "nested third-party jar: ${name}"
                    return
                }
                if (name.startsWith('META-INF/licenses/')) {
                    problems << "bundled third-party licence text: ${name}"
                    return
                }
                if (allowedFiles.contains(name)) return
                if (allowedPrefixes.any { name.startsWith(it) }) return
                problems << "unexpected entry: ${name}"
            }
        }

        if (licenseText == null) {
            problems << 'META-INF/LICENSE is missing from the jar'
        } else {
            if (!licenseText.contains('SPDX-License-Identifier: LicenseRef-CustomPerm-ARR')) {
                problems << 'META-INF/LICENSE does not declare LicenseRef-CustomPerm-ARR'
            }
            if (licenseText.contains('12. THIRD-PARTY COMPONENTS')) {
                problems << 'the licence carries a third-party clause while the jar bundles nothing'
            }
        }
        if (modsToml == null) {
            problems << 'META-INF/neoforge.mods.toml is missing from the jar'
        } else if (!modsToml.contains('LicenseRef-CustomPerm-ARR')) {
            problems << 'the mod metadata does not name LicenseRef-CustomPerm-ARR'
        }

        if (problems) {
            throw new GradleException(
                "The package no longer matches the licence:\n  - " + problems.join('\n  - ') +
                "\nSee LICENSE and NOTICE.md: bundling a component means reopening the third-party clause.")
        }
        logger.lifecycle('verifyPackage: the jar carries nothing third-party and its licence metadata agrees.')
    }
}

tasks.named('check') { dependsOn 'verifyPackage' }

// Everything that runs headless, in order: unit tests and the package check, then the three GameTest modes, each
// judged from its log. The client and multi-server smoke runs open windows or databases and stay separate.
tasks.register('testAll') {
    group = 'verification'
    description = 'build, then the three GameTest modes, each verified from its log.'
    dependsOn 'build', 'runGameTestServer', 'runGameTestServerLuckPerms', 'runGameTestServerArcadia'
}
tasks.matching { it.name == 'runGameTestServerLuckPerms' }.configureEach { mustRunAfter 'runGameTestServer' }
tasks.matching { it.name == 'runGameTestServerArcadia' }.configureEach { mustRunAfter 'runGameTestServerLuckPerms' }
