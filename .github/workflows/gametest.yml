name: GameTests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  gametest:
    name: Run NeoForge GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests, package check and the three GameTest modes
        # testAll judges each GameTest mode from its log ("All N required tests passed", nothing fatal),
        # never from the exit code alone, which stays 0 when the server never started or ran nothing.
        run: ./gradlew testAll --no-daemon

      - name: Verify distributable jar contents
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(ls build/libs/customperm-*.jar | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Fx 'META-INF/neoforge.mods.toml'
          jar tf "$jar_file" | grep -Fx 'META-INF/MANIFEST.MF'

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            run/gametest/logs
            run/gametest-luckperms/logs
            run/gametest-arcadia/logs
            build/reports
