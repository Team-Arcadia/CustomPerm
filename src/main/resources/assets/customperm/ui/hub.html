     "openAliases", "openStatus". -->
<col class="window">
    <label class="title">CustomPerm — Administration</label>
    <label class="subtitle">Server command permissions</label>

    <col class="nav">
        <button class="nav-btn" onclick="openGrades">Grades</button>
        <button class="nav-btn" onclick="openAliases">Aliases</button>
        <button class="nav-btn" onclick="openStatus">Status</button>
    </col>

    <label class="footer">/customperm — admin panel</label>
</col>
